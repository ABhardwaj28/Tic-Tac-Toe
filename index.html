<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tictactoe.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1 class="game-title">TIC <span>TAC</span> TOE</h1>
        </header>

        <div class="scoreboard">
            <div class="score-card player-o">
                <span class="player-label">PLAYER O</span>
                <span id="score-o" class="score-value">0</span>
            </div>
            <div class="score-card ties">
                <span class="player-label">TIES</span>
                <span id="score-ties" class="score-value">0</span>
            </div>
            <div class="score-card player-x">
                <span class="player-label">PLAYER X</span>
                <span id="score-x" class="score-value">0</span>
            </div>
        </div>

        <div id="status" class="status-badge turn-o">
            <span id="status-text">Player O's Turn</span>
        </div>

        <div id="board" class="board"></div>

        <div class="actions">
            <button id="reset-btn" class="btn btn-reset">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                </svg>
                Restart Game
            </button>
        </div>
    </div>

    <script src="tictactoe.js"></script>
</body>
</html>
